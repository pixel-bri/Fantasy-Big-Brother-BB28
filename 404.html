<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fantasy Big Brother Draft</title>
    <script>
      const path = window.location.pathname + window.location.search + window.location.hash;
      const routePrefixes = new Set(["", "home", "owner", "admin", "history", "season", "league"]);
      const firstSegment = window.location.pathname.split("/").filter(Boolean)[0] || "";
      const appBase = routePrefixes.has(firstSegment) ? "/" : `/${firstSegment}/`;

      window.sessionStorage.setItem("bb-draft-redirect", path);
      window.location.replace(appBase);
    </script>
  </head>
  <body></body>
</html>
